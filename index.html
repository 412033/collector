<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星軌珍藏閣 | Orbit Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5', // Indigo 600
                        secondary: '#818cf8', // Indigo 400
                        background: '#f8fafc',
                        surface: '#ffffff',
                    }
                }
            }
        }
    </script>
    <style>
        /* 隱藏捲軸但保持可捲動 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ✨ 星空背景特效 */
        .starry-bg {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 90px 40px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 120px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 190px 190px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 220px 50px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 250px 140px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: stars 120s linear infinite;
        }
        
        @keyframes stars {
            0% { background-position: 0 0; }
            100% { background-position: 300px -300px; }
        }

        /* ✨ 強化面板的玻璃微透質感 */
        .bg-surface {
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="starry-bg text-gray-800 font-sans antialiased h-screen flex overflow-hidden">

    <!-- 側邊欄 -->
    <aside class="w-64 bg-surface border-r border-gray-200 flex-shrink-0 flex flex-col transition-all duration-300 hidden md:flex z-20">
        <div class="p-6">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-purple-500 flex items-center gap-2">
                <i class="fa-solid fa-meteor text-primary"></i>
                星軌珍藏閣
            </h1>
        </div>

        <nav class="flex-1 px-4 space-y-2 overflow-y-auto">
            <a href="#" onclick="window.filterItems('all')" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-primary font-medium transition-colors" id="nav-all">
                <i class="fa-solid fa-border-all"></i> 全部珍藏
            </a>
            <a href="#" onclick="window.filterItems('favorites')" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors" id="nav-favorites">
                <i class="fa-solid fa-star text-yellow-400"></i> 高分摯愛
            </a>
            <div class="pt-4 pb-2">
                <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider">分類</p>
                <div id="category-list" class="mt-2 space-y-1">
                    <!-- 分類列表由 JS 產生 -->
                </div>
            </div>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 cursor-pointer transition-colors" id="login-btn">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-100 to-indigo-100 flex items-center justify-center text-primary font-bold shadow-sm overflow-hidden">
                    <i class="fa-brands fa-google"></i>
                </div>
                <div>
                    <p class="text-sm font-semibold text-gray-700" id="user-name">尚未登入</p>
                    <p class="text-xs text-gray-500" id="login-text">點擊 Google 登入</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- 頂部導航 (手機版) -->
    <div class="md:hidden fixed top-0 left-0 right-0 h-16 bg-surface border-b border-gray-200 z-30 flex items-center justify-between px-4">
        <h1 class="text-xl font-bold text-primary flex items-center gap-2">
            <i class="fa-solid fa-meteor"></i> 星軌
        </h1>
        <button onclick="window.toggleMobileMenu()" class="text-gray-600 focus:outline-none">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>
    </div>

    <!-- 主內容區 -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden pt-16 md:pt-0 relative">
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            
            <!-- 標題列 -->
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-3xl font-bold text-gray-800" id="current-view-title">我的專屬資料庫</h2>
                    <p class="text-gray-500 mt-1">管理您的數位珍藏與回憶</p>
                </div>
                <button onclick="window.openModal()" class="bg-gradient-to-r from-primary to-indigo-500 hover:from-indigo-600 hover:to-purple-600 text-white px-6 py-3 rounded-full font-medium shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> 刻下印記
                </button>
            </header>

            <!-- 統計數據 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-8">
                <div class="bg-surface p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-1">總藏品數量</p>
                        <h3 class="text-3xl font-bold text-gray-800" id="stat-total">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-blue-50 flex items-center justify-center text-blue-500 text-xl">
                        <i class="fa-solid fa-layer-group"></i>
                    </div>
                </div>
                <div class="bg-surface p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-1">高分收藏 (≥4星)</p>
                        <h3 class="text-3xl font-bold text-gray-800" id="stat-high">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-500 text-xl">
                        <i class="fa-solid fa-star"></i>
                    </div>
                </div>
                <div class="bg-surface p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-500 mb-1">總估值 (NT$)</p>
                        <h3 class="text-3xl font-bold text-gray-800" id="stat-value">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-green-50 flex items-center justify-center text-green-500 text-xl">
                        <i class="fa-solid fa-sack-dollar"></i>
                    </div>
                </div>
            </div>

            <!-- 收藏品網格 -->
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- 卡片由 JS 產生 -->
            </div>

            <!-- 空白狀態 -->
            <div id="empty-state" class="hidden flex-col items-center justify-center py-20 px-4 text-center">
                <div class="w-32 h-32 bg-gray-50 rounded-full flex items-center justify-center mb-6">
                    <i class="fa-solid fa-box-open text-6xl text-gray-300"></i>
                </div>
                <h3 class="text-2xl font-bold text-gray-700 mb-2">宇宙裡還沒有任何星體</h3>
                <p class="text-gray-500 max-w-md mx-auto mb-6" id="empty-state-text">請先登入，或點擊右上角「刻下印記」按鈕，寫入您的第一筆收藏！</p>
                <button onclick="window.openModal()" class="text-primary font-medium hover:underline">立即新增</button>
            </div>

        </div>
    </main>

    <!-- 寫入/編輯 收藏 Modal -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-surface w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-nib text-primary"></i> 寫入新紀錄
                </h3>
                <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <form id="item-form" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <!-- 左側欄 -->
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">名稱 <span class="text-red-500">*</span></label>
                                <input type="text" id="item-name" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">分類 <span class="text-red-500">*</span></label>
                                <div class="relative">
                                    <input type="text" id="item-category" required list="category-options" placeholder="輸入或選擇分類" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                                    <datalist id="category-options"></datalist>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">估值 / 購買價格</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-2.5 text-gray-500">$</span>
                                    <input type="number" id="item-value" placeholder="0" class="w-full pl-8 pr-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">喜愛程度</label>
                                <div class="flex items-center gap-2 text-2xl text-gray-300" id="star-rating">
                                    <i class="fa-solid fa-star cursor-pointer hover:text-yellow-400 transition-colors" data-value="1"></i>
                                    <i class="fa-solid fa-star cursor-pointer hover:text-yellow-400 transition-colors" data-value="2"></i>
                                    <i class="fa-solid fa-star cursor-pointer hover:text-yellow-400 transition-colors" data-value="3"></i>
                                    <i class="fa-solid fa-star cursor-pointer hover:text-yellow-400 transition-colors" data-value="4"></i>
                                    <i class="fa-solid fa-star cursor-pointer hover:text-yellow-400 transition-colors" data-value="5"></i>
                                </div>
                                <input type="hidden" id="item-rating" value="0">
                            </div>
                        </div>

                        <!-- 右側欄 -->
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">圖片上傳</label>
                                <p class="text-xs text-gray-500 mb-2">上傳圖片將自動壓縮為合適的 Base64 格式</p>
                                <div class="border-2 border-dashed border-gray-300 rounded-xl p-4 text-center relative hover:bg-gray-50 transition-colors cursor-pointer group" id="image-upload-container">
                                    <input type="file" id="item-image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                                    <div id="image-preview" class="hidden w-full h-40 object-contain rounded-lg mb-2"></div>
                                    <div id="upload-placeholder" class="py-4">
                                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 group-hover:text-primary transition-colors mb-2"></i>
                                        <p class="text-sm text-gray-600">點擊或拖曳圖片至此</p>
                                    </div>
                                </div>
                                <input type="hidden" id="item-image-base64">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                                <textarea id="item-description" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-gray-50/50">
                <button type="button" onclick="window.closeModal()" class="px-5 py-2 rounded-xl text-gray-600 hover:bg-gray-200 font-medium transition-colors">取消</button>
                <button type="button" id="save-btn" class="px-5 py-2 rounded-xl bg-primary text-white hover:bg-indigo-700 font-medium shadow-md shadow-indigo-200 transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-database"></i> 寫入資料庫
                </button>
            </div>
        </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div id="delete-modal" class="fixed inset-0 z-[60] hidden bg-gray-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-surface w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden p-6 text-center">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-triangle-exclamation text-2xl text-red-500"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">確認刪除</h3>
            <p class="text-gray-500 mb-6">確定要刪除這件收藏嗎？刪除後雲端資料將無法復原。</p>
            <div class="flex gap-3 justify-center">
                <button onclick="window.closeDeleteModal()" class="px-5 py-2 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-50 font-medium transition-colors flex-1">取消</button>
                <button id="confirm-delete-btn" class="px-5 py-2 rounded-xl bg-red-500 text-white hover:bg-red-600 font-medium shadow-md transition-colors flex-1">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-[70] flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-blue-400" id="toast-icon"></i>
        <span id="toast-msg">操作成功</span>
    </div>

    <!-- Firebase 與應用邏輯腳本 -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAvbaxpKhNFlTL3dbntJmIgNJYRkCwFGN4",
            authDomain: "collector-f5684.firebaseapp.com",
            projectId: "collector-f5684",
            storageBucket: "collector-f5684.firebasestorage.app",
            messagingSenderId: "69866279391",
            appId: "1:69866279391:web:057f5a03bd4888a643f46a"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 應用程式狀態
        let items = [];
        let currentFilter = 'all';
        let isLoggedIn = false;
        let itemToDelete = null;
        let unsubscribeSnapshot = null; // 儲存資料庫監聽器的取消函數

        // 頁面初始化
        document.addEventListener('DOMContentLoaded', () => {
            setupRatingStars();
            setupImageUpload();
            renderItems(); // 初始渲染空白狀態
            
            // 綁定儲存按鈕
            document.getElementById('save-btn').addEventListener('click', saveItemToFirestore);

            // 登入/登出按鈕事件
            document.getElementById('login-btn').addEventListener('click', async () => {
                if (isLoggedIn) {
                    try {
                        await signOut(auth);
                    } catch(e) {
                        showToast('登出發生錯誤', false);
                    }
                } else {
                    try {
                        showToast('正在呼叫 Google 登入...', true);
                        await signInWithPopup(auth, provider);
                    } catch (error) {
                        console.error("Login failed", error);
                        showToast('登入失敗或已取消', false);
                    }
                }
            });
        });

        // 監聽登入狀態改變
        onAuthStateChanged(auth, (user) => {
            const nameEl = document.getElementById('user-name');
            const textEl = document.getElementById('login-text');
            const iconContainer = document.querySelector('#login-btn > div');
            
            if (user) {
                isLoggedIn = true;
                nameEl.textContent = user.displayName || '使用者';
                textEl.textContent = '點擊登出';
                
                // 更換為使用者頭像或綠色狀態
                iconContainer.classList.remove('from-blue-100', 'to-indigo-100');
                if (user.photoURL) {
                    iconContainer.innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover" referrerpolicy="no-referrer">`;
                } else {
                    iconContainer.classList.add('from-green-100', 'to-emerald-100');
                    iconContainer.innerHTML = '<i class="fa-solid fa-user-astronaut text-green-600"></i>';
                }
                
                showToast('登入成功，同步資料中...', true);
                document.getElementById('empty-state-text').textContent = "目前的分類下沒有資料。點擊右上角「刻下印記」按鈕，寫入您的第一筆收藏吧！";
                
                // 載入該使用者的資料
                loadFirestoreData(user.uid);
            } else {
                isLoggedIn = false;
                nameEl.textContent = '尚未登入';
                textEl.textContent = '點擊 Google 登入';
                iconContainer.classList.remove('from-green-100', 'to-emerald-100');
                iconContainer.classList.add('from-blue-100', 'to-indigo-100');
                iconContainer.innerHTML = '<i class="fa-brands fa-google text-primary"></i>';
                
                document.getElementById('empty-state-text').textContent = "請先登入，或點擊右上角「刻下印記」按鈕，寫入您的第一筆收藏！";

                // 清除資料與監聽器
                if (unsubscribeSnapshot) {
                    unsubscribeSnapshot();
                    unsubscribeSnapshot = null;
                }
                items = [];
                renderCategories();
                renderItems();
                updateStats();
                showToast('您已登出', true);
            }
        });

        // 載入 Firestore 資料
        function loadFirestoreData(uid) {
            const itemsRef = collection(db, "users", uid, "vault_items");
            const q = query(itemsRef, orderBy("createdAt", "desc"));
            
            // onSnapshot 提供即時資料同步
            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                items = [];
                snapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });
                renderCategories();
                renderItems();
                updateStats();
            }, (error) => {
                console.error("Error fetching data:", error);
                showToast('讀取資料庫失敗，請檢查權限', false);
            });
        }

        // 星星 HTML
        function getStarsHTML(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= rating) {
                    html += `<i class="fa-solid fa-star text-yellow-400 text-sm"></i>`;
                } else {
                    html += `<i class="fa-regular fa-star text-gray-300 text-sm"></i>`;
                }
            }
            return html;
        }

        // 渲染卡片網格
        function renderItems() {
            const grid = document.getElementById('items-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            let filteredItems = items;
            
            if (currentFilter === 'favorites') {
                filteredItems = items.filter(item => item.rating >= 4);
                document.getElementById('current-view-title').textContent = '高分摯愛';
            } else if (currentFilter !== 'all') {
                filteredItems = items.filter(item => item.category === currentFilter);
                document.getElementById('current-view-title').textContent = `分類: ${currentFilter}`;
            } else {
                document.getElementById('current-view-title').textContent = '我的專屬資料庫';
            }

            if (filteredItems.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredItems.forEach(item => {
                    const formattedValue = new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(item.value || 0);
                    
                    const card = document.createElement('div');
                    card.className = 'bg-surface rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow group relative';
                    
                    const imgSrc = item.imageBase64 ? item.imageBase64 : `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23f3f4f6" width="100" height="100"/><text fill="%239ca3af" font-family="sans-serif" font-size="30" dy="10.5" font-weight="bold" x="50" y="50" text-anchor="middle">無圖片</text></svg>`;

                    // 處理時間戳
                    let timeStr = "剛剛";
                    if(item.createdAt) {
                        const date = new Date(item.createdAt);
                        timeStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                    }

                    card.innerHTML = `
                        <div class="h-48 overflow-hidden bg-gray-50 relative">
                            <img src="${imgSrc}" alt="${item.name}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-500">
                            <div class="absolute top-3 left-3 bg-black/50 backdrop-blur-md text-white text-xs px-2 py-1 rounded-md">
                                ${item.category}
                            </div>
                            <div class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button onclick="window.promptDelete('${item.id}')" class="w-8 h-8 bg-white/90 rounded-full text-red-500 hover:bg-red-500 hover:text-white flex items-center justify-center shadow-sm transition-colors">
                                    <i class="fa-solid fa-trash-can text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-lg font-bold text-gray-800 truncate pr-2">${item.name}</h3>
                                <div class="flex shrink-0 mt-1">${getStarsHTML(item.rating)}</div>
                            </div>
                            <p class="text-sm text-gray-500 line-clamp-2 mb-4 h-10">${item.description || '無描述'}</p>
                            <div class="flex justify-between items-center pt-3 border-t border-gray-50">
                                <span class="text-xs text-gray-400"><i class="fa-regular fa-clock"></i> ${timeStr}</span>
                                <span class="font-bold text-primary">${formattedValue}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        // 渲染分類
        function renderCategories() {
            const list = document.getElementById('category-list');
            const datalist = document.getElementById('category-options');
            list.innerHTML = '';
            datalist.innerHTML = '';

            const categories = [...new Set(items.map(item => item.category))].filter(Boolean);

            categories.forEach(cat => {
                const a = document.createElement('a');
                a.href = '#';
                a.onclick = (e) => { e.preventDefault(); window.filterItems(cat); };
                a.className = 'block px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg transition-colors';
                a.innerHTML = `<i class="fa-solid fa-tag text-gray-400 mr-2 text-xs"></i> ${cat}`;
                list.appendChild(a);

                const option = document.createElement('option');
                option.value = cat;
                datalist.appendChild(option);
            });
        }

        function updateStats() {
            const totalItems = items.length;
            const highRated = items.filter(item => item.rating >= 4).length;
            const totalValue = items.reduce((sum, item) => sum + (parseFloat(item.value) || 0), 0);

            animateValue('stat-total', parseInt(document.getElementById('stat-total').innerHTML)||0, totalItems, 500);
            animateValue('stat-high', parseInt(document.getElementById('stat-high').innerHTML)||0, highRated, 500);
            
            const valueEl = document.getElementById('stat-value');
            valueEl.textContent = new Intl.NumberFormat('zh-TW').format(totalValue);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if(start === end) { obj.innerHTML = end; return; }
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        // 圖片上傳與自動壓縮機制 (防止超過 Firestore 1MB 限制)
        function setupImageUpload() {
            const input = document.getElementById('item-image');
            const preview = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');
            const base64Input = document.getElementById('item-image-base64');

            input.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = new Image();
                        img.onload = function() {
                            // 壓縮邏輯：最大寬高限制 800px
                            const MAX_WIDTH = 800;
                            const MAX_HEIGHT = 800;
                            let width = img.width;
                            let height = img.height;

                            if (width > height) {
                                if (width > MAX_WIDTH) {
                                    height *= MAX_WIDTH / width;
                                    width = MAX_WIDTH;
                                }
                            } else {
                                if (height > MAX_HEIGHT) {
                                    width *= MAX_HEIGHT / height;
                                    height = MAX_HEIGHT;
                                }
                            }

                            const canvas = document.createElement('canvas');
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            // 轉為 jpeg 格式，品質 0.7 以縮小體積
                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                            
                            base64Input.value = compressedBase64;
                            preview.innerHTML = `<img src="${compressedBase64}" class="w-full h-full object-contain rounded-lg">`;
                            preview.classList.remove('hidden');
                            placeholder.classList.add('hidden');
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function setupRatingStars() {
            const stars = document.querySelectorAll('#star-rating i');
            const ratingInput = document.getElementById('item-rating');

            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const value = parseInt(this.getAttribute('data-value'));
                    ratingInput.value = value;
                    stars.forEach((s, index) => {
                        if (index < value) {
                            s.classList.replace('text-gray-300', 'text-yellow-400');
                            s.classList.replace('fa-regular', 'fa-solid');
                        } else {
                            s.classList.replace('text-yellow-400', 'text-gray-300');
                            s.classList.replace('fa-solid', 'fa-regular');
                        }
                    });
                });
            });
        }

        // 新增資料到 Firestore
        async function saveItemToFirestore() {
            const name = document.getElementById('item-name').value.trim();
            const category = document.getElementById('item-category').value.trim();
            
            if (!name || !category) {
                showToast('請填寫名稱與分類！', false);
                return;
            }
            if (!isLoggedIn) {
                showToast('登入狀態異常，請重新登入', false);
                return;
            }

            const btn = document.getElementById('save-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 寫入中...';

            const newItem = {
                name: name,
                category: category,
                value: parseFloat(document.getElementById('item-value').value) || 0,
                rating: parseInt(document.getElementById('item-rating').value) || 0,
                description: document.getElementById('item-description').value,
                imageBase64: document.getElementById('item-image-base64').value,
                createdAt: Date.now()
            };

            try {
                // 使用使用者的 uid 作為子集合路徑
                await addDoc(collection(db, "users", auth.currentUser.uid, "vault_items"), newItem);
                window.closeModal();
                showToast('雲端資料庫寫入成功！', true);
            } catch(e) {
                console.error("Firestore Error:", e);
                showToast('寫入失敗，請檢查權限或檔案大小是否超過限制', false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-database"></i> 寫入資料庫';
            }
        }

        // 刪除 Firestore 資料
        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (itemToDelete && isLoggedIn && auth.currentUser) {
                const btn = document.getElementById('confirm-delete-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 刪除中...';

                try {
                    await deleteDoc(doc(db, "users", auth.currentUser.uid, "vault_items", itemToDelete));
                    window.closeDeleteModal();
                    showToast('已從雲端刪除', true);
                } catch(e) {
                    console.error("Delete error:", e);
                    showToast('刪除失敗', false);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '確認刪除';
                }
            }
        });

        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-msg').textContent = msg;
            
            if (isSuccess) {
                icon.className = 'fa-solid fa-circle-check text-green-400';
            } else {
                icon.className = 'fa-solid fa-triangle-exclamation text-red-400';
            }
            
            toast.classList.remove('opacity-0');
            setTimeout(() => { toast.classList.add('opacity-0'); }, 3000);
        }

        // 將 HTML 需要呼叫的函式掛載到 window 供全域使用
        window.filterItems = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('nav a').forEach(a => {
                a.classList.remove('bg-indigo-50', 'text-primary', 'font-medium');
                a.classList.add('text-gray-600');
            });
            if (filter === 'all') {
                document.getElementById('nav-all').classList.add('bg-indigo-50', 'text-primary', 'font-medium');
                document.getElementById('nav-all').classList.remove('text-gray-600');
            } else if (filter === 'favorites') {
                document.getElementById('nav-favorites').classList.add('bg-indigo-50', 'text-primary', 'font-medium');
                document.getElementById('nav-favorites').classList.remove('text-gray-600');
            }
            renderItems();
        };

        window.openModal = () => {
            if (!isLoggedIn) {
                showToast('請先登入才能新增收藏！', false);
                return;
            }
            document.getElementById('item-form').reset();
            document.getElementById('item-image-base64').value = '';
            document.getElementById('image-preview').style.backgroundImage = 'none';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            
            document.getElementById('item-rating').value = 0;
            document.querySelectorAll('#star-rating i').forEach(star => {
                star.classList.replace('text-yellow-400', 'text-gray-300');
                star.classList.replace('fa-solid', 'fa-regular');
            });
            document.getElementById('add-modal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('add-modal').classList.add('hidden');
        };

        window.promptDelete = (id) => {
            itemToDelete = id;
            document.getElementById('delete-modal').classList.remove('hidden');
        };

        window.closeDeleteModal = () => {
            document.getElementById('delete-modal').classList.add('hidden');
            itemToDelete = null;
        };

        window.toggleMobileMenu = () => {
            const sidebar = document.querySelector('aside');
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('fixed', 'inset-y-0', 'left-0', 'shadow-2xl', 'z-40');
            } else {
                sidebar.classList.add('hidden');
                sidebar.classList.remove('fixed', 'inset-y-0', 'left-0', 'shadow-2xl', 'z-40');
            }
        };

    </script>
</body>
</html>
